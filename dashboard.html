<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Merchant dashboard</title>
  <style nonce="__NONCE__">
    :root {
      --bg: #f6f7fb;
      --card: rgba(255, 255, 255, .78);
      --solid: #fff;
      --ink: #0f1623;
      --mute: #667085;
      --line: rgba(15, 22, 35, .09);
      --brand: #0d9488;
      --brand2: #6366f1;
      --ok: #16a34a;
      --bad: #dc2626;
      --warn: #d97706;
      --sh: 0 1px 2px rgba(15, 22, 35, .04), 0 8px 28px -12px rgba(15, 22, 35, .14);
      --r: 16px
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #070a10;
        --card: rgba(21, 27, 38, .72);
        --solid: #151b26;
        --ink: #eef1f6;
        --mute: #93a0b4;
        --line: rgba(255, 255, 255, .08);
        --brand: #2dd4bf;
        --brand2: #818cf8;
        --ok: #4ade80;
        --bad: #f87171;
        --warn: #fbbf24;
        --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 34px -12px rgba(0, 0, 0, .6)
      }
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .28;
      animation: drift 22s ease-in-out infinite alternate
    }

    body::before {
      background: var(--brand);
      top: -18vmax;
      left: -12vmax
    }

    body::after {
      background: var(--brand2);
      bottom: -20vmax;
      right: -14vmax;
      animation-delay: -9s
    }

    @keyframes drift {
      to {
        transform: translate3d(6vmax, 4vmax, 0) scale(1.15)
      }
    }

    body.busy::marker {
      content: ""
    }

    body::selection {
      background: var(--brand);
      color: #fff
    }

    #app::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      z-index: 50;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      transition: opacity .3s;
      opacity: 0
    }

    body.busy #app::before {
      opacity: 1;
      animation: load 1.1s ease-in-out infinite
    }

    @keyframes load {
      0% {
        width: 0;
        left: 0
      }

      60% {
        width: 70%
      }

      100% {
        width: 0;
        left: 100%
      }
    }

    a {
      color: var(--brand);
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 18px 60px
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: center;
      padding: 10px 18px;
      background: var(--card);
      backdrop-filter: saturate(1.6) blur(18px);
      -webkit-backdrop-filter: saturate(1.6) blur(18px);
      border-bottom: 1px solid var(--line);
      animation: down .5s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes down {
      from {
        transform: translateY(-100%);
        opacity: 0
      }
    }

    .logo {
      margin-right: 14px;
      font-weight: 800;
      letter-spacing: -.3px;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    nav a {
      position: relative;
      padding: 7px 11px;
      border-radius: 10px;
      color: var(--mute);
      font-weight: 500;
      transition: color .2s, background .2s
    }

    nav a:hover {
      color: var(--ink);
      background: var(--line);
      text-decoration: none
    }

    nav a.on {
      color: var(--ink);
      font-weight: 650
    }

    nav a.on::after {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      bottom: -11px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      animation: grow .35s ease
    }

    @keyframes grow {
      from {
        transform: scaleX(0)
      }
    }

    nav .sp {
      flex: 1
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      margin: 14px 0;
      box-shadow: var(--sh);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s
    }

    .grid .card:hover {
      transform: translateY(-3px)
    }

    .wrap>* {
      animation: rise .55s cubic-bezier(.2, .8, .2, 1) both
    }

    .wrap>*:nth-child(2) {
      animation-delay: .05s
    }

    .wrap>*:nth-child(3) {
      animation-delay: .1s
    }

    .wrap>*:nth-child(4) {
      animation-delay: .15s
    }

    .wrap>*:nth-child(5) {
      animation-delay: .2s
    }

    .wrap>*:nth-child(n+6) {
      animation-delay: .25s
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }
    }

    .grid>* {
      animation: rise .6s cubic-bezier(.2, .8, .2, 1) both
    }

    .grid>*:nth-child(2) {
      animation-delay: .07s
    }

    .grid>*:nth-child(3) {
      animation-delay: .14s
    }

    .grid>*:nth-child(4) {
      animation-delay: .21s
    }

    h1 {
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -.6px;
      margin: 6px 0 4px
    }

    h2 {
      font-size: 16px;
      font-weight: 650;
      margin: 0 0 10px
    }

    .m {
      color: var(--mute);
      font-size: 13px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px
    }

    .grid .card {
      margin: 0
    }

    .big {
      font-size: 30px;
      font-weight: 780;
      letter-spacing: -1px;
      background: linear-gradient(120deg, var(--ink), var(--brand));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    label {
      display: block
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--solid);
      color: var(--ink);
      font: inherit;
      margin: 5px 0 12px;
      transition: border-color .2s, box-shadow .2s
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent)
    }

    .auto {
      width: auto;
      margin: 0 8px
    }

    input.auto {
      margin: 0 6px 0 0
    }

    button {
      position: relative;
      overflow: hidden;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      font: 600 14px inherit;
      cursor: pointer;
      box-shadow: 0 6px 18px -8px var(--brand);
      transition: transform .15s, box-shadow .2s, filter .2s
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.07);
      box-shadow: 0 10px 22px -8px var(--brand)
    }

    button:active {
      transform: translateY(1px) scale(.98)
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%);
      transform: translateX(-120%)
    }

    button:hover::after {
      transform: translateX(120%);
      transition: transform .7s
    }

    button.g {
      background: transparent;
      color: var(--mute);
      border: 1px solid var(--line);
      box-shadow: none
    }

    button.g:hover {
      color: var(--ink);
      background: var(--line)
    }

    button.d {
      background: var(--bad);
      box-shadow: 0 6px 18px -8px var(--bad)
    }

    .x {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mute);
      font-weight: 600
    }

    th,
    td {
      text-align: left;
      padding: 11px 8px;
      border-bottom: 1px solid var(--line)
    }

    tbody tr,
    tr {
      transition: background .15s
    }

    tr:hover td {
      background: color-mix(in srgb, var(--brand) 6%, transparent)
    }

    code {
      font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--line);
      padding: 2px 6px;
      border-radius: 6px
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--line);
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize
    }

    .tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .paid,
    .succeeded,
    .approved,
    .active,
    .verified {
      color: var(--ok)
    }

    .failed,
    .rejected,
    .disabled,
    .revoked,
    .suspended {
      color: var(--bad)
    }

    .pending,
    .submitted,
    .unverified,
    .trialing,
    .past_due {
      color: var(--warn)
    }

    .pending::before,
    .past_due::before {
      animation: pulse 1.4s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        opacity: .25;
        transform: scale(1.6)
      }
    }

    .note {
      border: 1px solid color-mix(in srgb, var(--brand) 45%, transparent);
      background: color-mix(in srgb, var(--brand) 9%, var(--solid));
      border-radius: 13px;
      padding: 13px 15px;
      margin: 14px 0;
      word-break: break-all;
      animation: pop .5s cubic-bezier(.2, 1.2, .3, 1) both
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.96) translateY(-6px)
      }
    }

    .err {
      color: var(--bad);
      min-height: 20px;
      font-weight: 550
    }

    .err:not(:empty) {
      animation: shake .4s
    }

    @keyframes shake {
      25% {
        transform: translateX(-5px)
      }

      75% {
        transform: translateX(5px)
      }
    }

    .auth {
      max-width: 410px;
      margin: 9vh auto;
      padding: 30px;
      animation: pop .6s cubic-bezier(.2, 1, .3, 1) both
    }

    .auth h1 {
      background: linear-gradient(90deg, var(--ink), var(--brand));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    progress {
      width: 100%;
      height: 10px;
      border: 0;
      border-radius: 9px;
      overflow: hidden;
      background: var(--line);
      margin: 8px 0
    }

    progress::-webkit-progress-bar {
      background: var(--line)
    }

    progress::-webkit-progress-value {
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      border-radius: 9px;
      transition: width 1s
    }

    progress::-moz-progress-bar {
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      border-radius: 9px
    }

    @media(max-width:640px) {
      nav {
        overflow-x: auto;
        flex-wrap: nowrap
      }

      nav a,
      nav .m,
      nav select,
      nav button {
        flex: none
      }

      .wrap {
        padding: 14px 12px 50px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script nonce="__NONCE__">
    const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = p => '₹' + (p / 100).toLocaleString('en-IN', { minimumFractionDigits: 2 }), dt = d => d ? new Date(d).toLocaleString() : '-';
    let S = null, note = '', err = '';
    async function api(m, p, b, r) {
      const res = await fetch(p, { method: m, headers: { 'content-type': 'application/json', 'x-csrf-token': S?.csrf_token || '' }, body: b ? JSON.stringify(b) : undefined });
      const j = res.status === 204 ? {} : await res.json().catch(() => ({}));
      if (res.status === 403 && j.error?.code === 'step_up_required' && !r) {
        const v = prompt(S.merchant.totp_enabled ? 'Confirm with your 2FA code' : 'Confirm your password');
        if (v) { const s = await fetch('/auth/step-up', { method: 'POST', headers: { 'content-type': 'application/json', 'x-csrf-token': S.csrf_token }, body: JSON.stringify(S.merchant.totp_enabled ? { code: v } : { password: v }) }); if (s.ok) return api(m, p, b, 1) }
      }
      if (!res.ok) throw j.error || { code: 'error' }; return j
    }
    const tbl = (h, rows) => `<div class=x><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan=${h.length} class=m>Nothing yet</td></tr>`}</table></div>`;
    const tag = s => `<span class="tag ${E(s)}">${E(s)}</span>`;
    const btn = (a, id, l, c = 'g') => `<button class="${c}" data-a="${a}" data-id="${E(id)}">${l}</button>`;
    const fld = (n, l, t = 'text', x = '') => `<label class=m>${l}<input name=${n} type=${t} ${x}></label>`;
    const form = (f, body, go = 'Save') => `<form data-f="${f}">${body}<button>${go}</button></form>`;
    const tabs = [['overview', 'Overview'], ['orders', 'Orders'], ['accounts', 'Payout'], ['webhooks', 'Webhooks'], ['keys', 'API keys'], ['billing', 'Billing'], ['security', 'Security'], ['kyc', 'KYC']];
    const shell = (on, body) => `<nav><b class=logo>◆ Gateway</b>${tabs.map(([k, l]) => `<a href="#/${k}" class="${k === on ? 'on' : ''}">${l}</a>`).join('')}<span class=sp></span>
<span class=m>${E(S.merchant.business_name)}</span><select id=mode class=auto><option>test</option><option>live</option></select>${btn('logout', '', 'Log out')}</nav>
<div class=wrap>${note ? `<div class=note>${note}</div>` : ''}<div class=err>${E(err)}</div>${body}</div>`;
    const authBox = (t, b) => `<div class="card auth"><h1>${t}</h1>${b}<div class=err>${E(err)}</div></div>`;

    const P = {
      login: () => authBox('Log in', form('login', fld('email', 'Email', 'email') + fld('password', 'Password', 'password') + `<div id=tf hidden>${fld('code', '2FA or recovery code')}</div>`, 'Log in') + `<p class=m><a href="#/signup">Create account</a> · <a href="#/forgot">Forgot password?</a></p>`),
      signup: () => authBox('Create account', form('signup', fld('business_name', 'Business name') + fld('email', 'Email', 'email') + fld('password', 'Password (10+ characters)', 'password'), 'Sign up') + `<p class=m><a href="#/login">Back to log in</a></p>`),
      forgot: () => authBox('Reset password', form('forgot', fld('email', 'Email', 'email'), 'Send link') + `<p class=m><a href="#/login">Back</a></p>`),
      reset: () => authBox('Choose a new password', form('reset', fld('new_password', 'New password', 'password'), 'Set password')),
      'verify-email': async () => { const t = new URLSearchParams(location.hash.split('?')[1]).get('token'); try { await api('POST', '/auth/verify-email', { token: t }); note = 'Email verified. Please log in.' } catch { err = 'This link is invalid or expired.' } location.hash = '#/login'; return null },
      async overview() {
        const s = await api('GET', '/dashboard/summary'), o = s.last_30_days.orders_by_status, n = s.needs_attention;
        return shell('overview', `<h1>Overview <span class=m>(${s.mode} mode)</span></h1><div class=grid>
  <div class=card><div class=m>Paid today (IST)</div><div class=big>${inr(s.today_ist.paid_amount)}</div><div class=m>${s.today_ist.paid_orders} orders</div></div>
  <div class=card><div class=m>Success rate, 30 days</div><div class=big>${s.last_30_days.success_rate ?? '-'}${s.last_30_days.success_rate == null ? '' : '%'}</div></div>
  <div class=card><div class=m>Flagged payments</div><div class=big>${n.flagged_payments}</div><div class=m>wrong amount, late, or paid twice</div></div>
  <div class=card><div class=m>Failed webhooks, 7 days</div><div class=big>${n.failed_webhook_deliveries}</div></div></div>
  <div class=card><h2>Setup</h2><p>Payout accounts: <b>${s.setup.payment_accounts}</b> · Webhook endpoints: <b>${s.setup.webhook_endpoints}</b> · API keys: <b>${s.setup.api_keys}</b> · KYC: ${tag(s.kyc_status)}</p>
  <div class=m>Orders (30 days): ${Object.entries(o).map(([k, v]) => `${E(k)} ${v.count}`).join(' · ') || 'none'}</div></div>`)
      },
      async orders() {
        const d = await api('GET', '/v1/orders?limit=50');
        return shell('orders', `<h1>Orders</h1><div class=card><h2>Create a test order</h2>${form('order', fld('amount', 'Amount (₹)', 'number', 'min=1 step=0.01 required') + fld('reference', 'Your reference (optional)'), 'Create')}</div>
  <div class=card>${tbl(['Order', 'Amount', 'Status', 'Confirmation', 'Created', ''], d.data.map(o => [E(o.id), inr(o.amount), tag(o.status), E(o.confirmation), dt(o.created_at),
        [`<a href="${E(o.checkout_url)}" target=_blank rel=noopener>pay page</a>`, (o.confirmation === 'merchant' && ['created', 'pending'].includes(o.status)) ? btn('markpaid', o.id, 'Mark paid') : ''].join(' ')]))}</div>`)
      },
      async accounts() {
        const [a, c] = await Promise.all([api('GET', '/v1/payment-accounts'), api('GET', '/v1/provider-connections')]);
        return shell('accounts', `<h1>Where your money goes</h1><p class=m>Customers pay your own account. We never hold funds.</p>
  <div class=card><h2>Payout accounts</h2>${tbl(['Type', 'UPI ID / name', 'Verification', 'Default', ''], a.data.map(x => [E(x.type), E(x.vpa || x.payee_name), tag(x.verification_status), x.is_default ? 'yes' : btn('default', x.id, 'Make default'), btn('delacc', x.id, 'Remove', 'd')]))}
  ${form('upi', fld('vpa', 'UPI ID (e.g. shop@okicici)') + fld('payee_name', 'Name shown in UPI apps'), 'Add UPI ID')}<p class=m>Raw UPI IDs need your approval before live use, and payments on them are confirmed by you.</p></div>
  <div class=card><h2>Razorpay (automatic confirmation)</h2>${tbl(['Mode', 'Status', 'Webhook URL', ''], c.data.map(x => [E(x.mode), tag(x.status), `<code>${E(x.webhook_url)}</code>`, btn('delcon', x.id, 'Disconnect', 'd')]))}
  ${form('rzp', fld('key_id', 'Key ID (rzp_test_… or rzp_live_…)') + fld('key_secret', 'Key secret', 'password') + fld('webhook_secret', 'Webhook secret', 'password'), 'Connect Razorpay')}</div>
  <div class=card><h2>Paytm (automatic confirmation)</h2>${form('paytm', fld('key_id', 'MID') + fld('key_secret', 'Merchant key', 'password') + '<label class=m>Environment<select name=mode><option>test</option><option>live</option></select></label>', 'Connect Paytm')}<p class=m>Needs Dynamic QR enabled by Paytm. Each QR lives 10 minutes.</p></div>`)
      },
      async webhooks() {
        const [e, d] = await Promise.all([api('GET', '/v1/webhook-endpoints'), api('GET', '/v1/webhook-deliveries?limit=30')]);
        return shell('webhooks', `<h1>Webhooks</h1><div class=card><h2>Endpoints</h2>${tbl(['URL', 'Events', 'Status', ''], e.data.map(x => [E(x.url), E(Array.isArray(x.events) ? x.events.join(', ') : 'all'), tag(x.status) + (x.disabled_reason ? ` <span class=m>${E(x.disabled_reason)}</span>` : ''),
        [btn('testhook', x.id, 'Send test'), x.status === 'active' ? btn('rotate', x.id, 'Rotate secret') : btn('enable', x.id, 'Re-enable'), btn('delhook', x.id, 'Delete', 'd')].join(' ')]))}
  ${form('hook', fld('url', 'HTTPS URL') + `<label class=m>Events <select name=events><option value="">All events</option><option>order.paid</option><option>order.expired</option><option>payment.flagged</option></select></label>`, 'Add endpoint')}</div>
  <div class=card><h2>Recent deliveries</h2>${tbl(['Event', 'Status', 'Attempts', 'Last response', 'When', ''], d.data.map(x => [E(x.event_type), tag(x.status), x.attempt_count, E(x.last_status_code || x.last_error || '-'), dt(x.created_at), x.status !== 'pending' ? btn('replay', x.id, 'Replay') : '']))}</div>`)
      },
      async billing() {
        const b = await api('GET', '/dashboard/billing'), s = b.subscription;
        return shell('billing', `<h1>Billing</h1><div class=card><h2>${E(s.plan)} plan ${tag(s.status)}</h2><p class=m>${s.status === 'trialing' ? 'Trial ends ' + dt(s.trial_ends_at) : s.current_period_end ? 'Current period ends ' + dt(s.current_period_end) : ''}</p>
  <div class=m>Live orders this period: ${s.live_orders_used} of ${s.live_order_limit}</div><progress value=${s.live_orders_used} max=${s.live_order_limit}></progress>
  <p>${b.plans.map(p => btn('plan', p.code, E(p.name) + ' · ' + inr(p.price_paise) + ' + GST', p.code === s.plan ? '' : 'g')).join(' ')}</p></div>
  <div class=card><h2>Invoices</h2>${tbl(['Number', 'Total', 'Status', 'Due', ''], b.invoices.map(i => [E(i.number), inr(i.total), tag(i.status), dt(i.due_at), `<a href="/dashboard/billing/invoices/${E(i.id)}/html" target=_blank rel=noopener>View</a> ` + (i.status === 'open' ? btn('payinv', i.id, 'Pay now', '') : '')]))}</div>`)
      },
      async keys() {
        const k = await api('GET', '/dashboard/api-keys');
        return shell('keys', `<h1>API keys</h1><div class=card>${tbl(['Key', 'Mode', 'Last used', 'Status', ''], k.data.map(x => [`<code>${E(x.prefix)}…</code>`, E(x.mode), dt(x.last_used_at), x.revoked_at ? tag('revoked') : tag('active'), x.revoked_at ? '' : btn('revoke', x.id, 'Revoke', 'd')]))}
  <p>${btn('newkey', 'test', 'New test key', '')} ${btn('newkey', 'live', 'New live key')}</p><p class=m>Keys go in your server only, never in a website or app.</p></div>`)
      },
      async security() {
        return shell('security', `<h1>Security</h1><div class=card><h2>Two-factor authentication</h2>
  ${S.merchant.totp_enabled ? `<p>${tag('active')} enabled.</p>${form('no2fa', fld('password', 'Password', 'password') + fld('code', 'Current 2FA code'), 'Turn off 2FA')}` : `<p class=m>Protects logins and sensitive changes.</p><div id=qr>${btn('setup2fa', '', 'Set up 2FA', '')}</div>`}</div>`)
      },
      async kyc() {
        const k = await api('GET', '/dashboard/kyc');
        return shell('kyc', `<h1>Business verification</h1><div class=card><p>Status: ${tag(k.kyc_status)} ${k.latest_submission?.reviewer_note ? `<span class=m>${E(k.latest_submission.reviewer_note)}</span>` : ''}</p><p class=m>Live payments unlock after approval.</p></div>
  ${['pending', 'rejected'].includes(k.kyc_status) ? `<div class=card>${form('kyc', fld('legal_name', 'Legal name') + `<label class=m>Business type<select name=business_type>${['individual', 'proprietorship', 'partnership', 'llp', 'private_limited', 'public_limited', 'trust_ngo'].map(x => `<option>${x}</option>`).join('')}</select></label>` + fld('pan', 'PAN') + fld('gstin', 'GSTIN (optional)') + fld('website', 'Website (optional)', 'url') +
          `<label class=m>Category<select name=category>${['retail', 'saas', 'education', 'services', 'food', 'travel', 'nonprofit', 'other'].map(x => `<option>${x}</option>`).join('')}</select></label><label class=m>What do you sell?<textarea name=description rows=3></textarea></label>` +
          `<label><input type=checkbox name=ok class=auto> I confirm we do not deal in gambling, betting, loan apps, adult content, or crypto, and I accept the terms.</label><br><br>`, 'Submit for review')}</div>` : ''}`)
      }
    };
    const H = {
      async paytm(d) { const r = await api('POST', '/v1/provider-connections', { provider: 'paytm', key_id: d.key_id, key_secret: d.key_secret, mode: d.mode }); note = 'Paytm connected. ' + E(r.next_step) },
      async login(d, f) { try { S = await api('POST', '/auth/login', { email: d.email, password: d.password, code: d.code || undefined }); location.hash = '#/overview' } catch (e) { if (e.code === 'totp_required') { $('#tf').hidden = false; err = 'Enter your 2FA code.' } else err = ({ invalid_credentials: 'Wrong email or password.', invalid_code: 'Wrong code.', email_not_verified: 'Verify your email first.', account_locked: 'Too many attempts. Try later.' })[e.code] || 'Could not log in.'; render(1) } },
      async signup(d) { try { await api('POST', '/auth/signup', d); note = 'Check your email for a verification link, then log in.'; location.hash = '#/login' } catch (e) { err = e.message || 'Check your details.'; render(1) } },
      async forgot(d) { await api('POST', '/auth/password/forgot', d).catch(() => { }); note = 'If that email has an account, a reset link is on its way.'; location.hash = '#/login' },
      async reset(d) { const t = new URLSearchParams(location.hash.split('?')[1]).get('token'); try { await api('POST', '/auth/password/reset', { token: t, new_password: d.new_password }); note = 'Password changed. Log in.'; location.hash = '#/login' } catch (e) { err = e.message || 'Link invalid or expired.'; render(1) } },
      async order(d) { const r = await api('POST', '/v1/orders', { amount: Math.round(d.amount * 100), reference: d.reference || undefined }); note = `Created. Open <a href="${E(r.checkout_url)}" target=_blank rel=noopener>the pay page</a>.` },
      async upi(d) { await api('POST', '/v1/payment-accounts', d) },
      async rzp(d) { const r = await api('POST', '/v1/provider-connections', { provider: 'razorpay', key_id: d.key_id, key_secret: d.key_secret, webhook_secret: d.webhook_secret || undefined }); note = `Connected. Add this webhook URL in Razorpay: <code>${E(r.webhook_url)}</code>` },
      async hook(d) { const r = await api('POST', '/v1/webhook-endpoints', { url: d.url, events: d.events ? [d.events] : undefined }); note = `Signing secret (shown once): <code>${E(r.secret)}</code>` },
      async kyc(d) { if (!d.ok) { err = 'Please confirm the declaration.'; return } await api('POST', '/dashboard/kyc', { legal_name: d.legal_name, business_type: d.business_type, pan: d.pan, gstin: d.gstin || undefined, website: d.website || undefined, category: d.category, description: d.description, no_prohibited_activity: true, accepts_terms: true }); note = 'Submitted for review.' },
      async no2fa(d) { await api('POST', '/auth/2fa/disable', d); S = await api('GET', '/auth/session'); note = '2FA turned off.' },
      async en2fa(d) { const r = await api('POST', '/auth/2fa/enable', { code: d.code }); S = await api('GET', '/auth/session'); note = '2FA on. Save these one-time recovery codes now:<br><code>' + r.recovery_codes.map(E).join('  ') + '</code>' }
    };
    const A = {
      async payinv(id) { const r = await api('POST', `/dashboard/billing/invoices/${id}/pay`); location.href = r.checkout_url },
      async plan(id) { const r = await api('POST', '/dashboard/billing/plan', { plan_code: id }); note = r.effective === 'now' ? 'Plan changed.' : 'Plan changes at your next invoice.' },
      async logout() { await api('POST', '/auth/logout').catch(() => { }); S = null; location.hash = '#/login' },
      async markpaid(id) { if (confirm('Confirm you received this payment in your bank?')) await api('POST', `/v1/orders/${id}/mark-paid`) },
      async default(id) { await api('POST', `/v1/payment-accounts/${id}/default`) },
      async delacc(id) { if (confirm('Remove this account?')) await api('DELETE', `/v1/payment-accounts/${id}`) },
      async delcon(id) { if (confirm('Disconnect Razorpay?')) await api('DELETE', `/v1/provider-connections/${id}`) },
      async testhook(id) { const r = await api('POST', `/v1/webhook-endpoints/${id}/test`); note = r.ok ? 'Test delivered.' : `Test failed: ${E(r.last_error || r.last_status_code)}` },
      async rotate(id) { const r = await api('POST', `/v1/webhook-endpoints/${id}/rotate-secret`); note = `New secret (shown once): <code>${E(r.secret)}</code> The old one works for 24h.` },
      async enable(id) { await api('PATCH', `/v1/webhook-endpoints/${id}`, { status: 'active' }) },
      async delhook(id) { if (confirm('Delete this endpoint?')) await api('DELETE', `/v1/webhook-endpoints/${id}`) },
      async replay(id) { await api('POST', `/v1/webhook-deliveries/${id}/replay`) },
      async newkey(m) { const r = await api('POST', '/dashboard/api-keys', { mode: m }); note = `Copy now, shown once: <code>${E(r.key)}</code>` },
      async revoke(id) { if (confirm('Revoke this key? Servers using it will stop working.')) await api('DELETE', `/dashboard/api-keys/${id}`) },
      async setup2fa() { const r = await api('POST', '/auth/2fa/setup'); $('#qr').innerHTML = `<img alt="QR" width=180 src="data:image/svg+xml;base64,${btoa(r.qr_svg)}"><p class=m>Or enter this key: <code>${E(r.secret)}</code></p>${form('en2fa', fld('code', '6-digit code'), 'Turn on 2FA')}`; return 'keep' }
    };
    const PUBLIC = ['login', 'signup', 'forgot', 'reset', 'verify-email'];
    async function render(keep) { document.body.classList.add('busy'); try { await render0(keep) } finally { document.body.classList.remove('busy') } }
    async function render0(keep) {
      const k = (location.hash.slice(2).split('?')[0]) || 'overview';
      try {
        if (!S && !PUBLIC.includes(k)) S = await api('GET', '/auth/session').catch(() => null);
        if (!S && !PUBLIC.includes(k)) { location.hash = '#/login'; return }
        if (S && PUBLIC.includes(k) && k !== 'reset' && k !== 'verify-email') { location.hash = '#/overview'; return }
        const html = await (P[k] || P.overview)(); if (html == null) return; $('#app').innerHTML = html;
        const m = $('#mode'); if (m) { m.value = S.merchant.mode || 'test'; m.onchange = async () => { try { await api('POST', '/auth/mode', { mode: m.value }); note = ''; render() } catch (e) { err = e.code === 'kyc_required' ? 'Live mode needs approved KYC.' : 'Could not switch.'; m.value = 'test'; render(1) } } }
      } catch (e) { err = e.code || 'Something went wrong'; $('#app').innerHTML = S ? shell(k, '') : authBox('Error', '') }
      if (!keep) { note = ''; err = '' }
    }
    document.addEventListener('submit', async ev => {
      ev.preventDefault(); const f = ev.target.dataset.f; if (!f) return; const d = Object.fromEntries(new FormData(ev.target)); err = '';
      try { await H[f](d); if (!['login', 'signup', 'forgot', 'reset'].includes(f)) await render(1); else if (f === 'login' || f === 'signup' || f === 'forgot' || f === 'reset') { } } catch (e) { err = e.message || e.code || 'Failed'; await render(1) }
    });
    document.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-a]'); if (!b) return; err = '';
      try { const r = await A[b.dataset.a](b.dataset.id); if (r !== 'keep') await render(1) } catch (e) { err = e.code || 'Failed'; await render(1) }
    });
    addEventListener('hashchange', () => render()); render();
  </script>
</body>

</html>
